name: Validate Project Cosmos

# Runs lint + typecheck + build + `pnpm test` + `pnpm validate` on every PR
# (and on push to main) to make sure Project Cosmos internal consistency never
# regresses. Designed to be marked as a REQUIRED status check in repo branch protection — once
# you do that in the UI (Settings → Branches → main → Add rule), no
# PR can merge without this passing, including auto-generated
# cosmos-sync PRs from the nightly cron.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cosmos
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Client API types match the server (types:emit)
        run: |
          pnpm types:emit
          git diff --exit-code client/src/api/cosmos-api.ts

      - name: Build (typecheck + vite)
        run: pnpm build

      - name: Typecheck drift-sync
        run: pnpm exec tsc -p drift-sync --noEmit

      - name: Test
        run: pnpm test

      - name: Validate Project Cosmos
        run: pnpm validate

  e2e:
    # Boots `pnpm dev` (Vite + the API dev server) and loads the map through /api/cosmos in Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout cosmos
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end loading test
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
