# The app now lives on Vercel. Pages only serves a redirect page so old deep links keep working.
name: Deploy Pages redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # Pages serves 404.html for unknown paths, so nested deep links redirect too.
      - run: cp pages-redirect/index.html pages-redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
